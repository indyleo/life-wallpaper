name: Release

# Releases are cut automatically: push to main with a new version in Cargo.toml
# and v<version> is tagged and released. If that tag already exists, nothing runs.
# Pushing a v* tag by hand, or "Run workflow", also works.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0 (leave empty to release the Cargo.toml version from the selected branch)"
        required: false

permissions:
  contents: write # create the tag + GitHub Release
  id-token: write # build provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: life-wallpaper

jobs:
  prepare:
    name: decide tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Work out the tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          explicit="${{ github.event.inputs.tag }}"
          if [ -z "$explicit" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            explicit="${{ github.ref_name }}"
          fi

          if [ -n "$explicit" ]; then
            # Hand-pushed or manually requested tag: it must match Cargo.toml.
            if [ "${explicit#v}" != "$version" ]; then
              echo "::error::tag $explicit does not match Cargo.toml version $version"
              exit 1
            fi
            echo "tag=$explicit" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main: release v<version> unless it was already released.
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; bump the version in Cargo.toml to release again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one arch failing must not kill the other
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 runner: avoids cross + a missing Wayland sysroot.
          # (Free on public repos only.)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Install Wayland build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          name="${BIN}-${tag}-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN}" "$stage/"
          cp README.md LICENSE "$stage/"
          cp man/life-wallpaper.1 "$stage/"
          cp -r config_example "$stage/"
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Creates the tag on the built commit if it doesn't exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
