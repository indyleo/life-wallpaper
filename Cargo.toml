[package]
name = "life-wallpaper"
version = "1.0.0"
edition = "2021"
description = "Conway's Game of Life as a native Wayland wallpaper (wlr-layer-shell, wl_shm)"

[dependencies]
# `calloop` feature gives us the calloop + calloop-wayland-source re-exports.
# Default features are off so we don't pull in xkbcommon (no keyboard needed).
smithay-client-toolkit = { version = "0.19", default-features = false, features = [
	"calloop",
] }
# Same calloop SCTK uses; we only add the `signals` feature (signalfd source).
calloop = { version = "0.13", features = ["signals"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

